<template>
  <style>
    @font-face { font-family: "AMS Text"; src: url("assets/fonts/Inter-Medium.woff2") format("woff2"); font-weight: 500; font-display: block; }
    @font-face { font-family: "AMS Text"; src: url("assets/fonts/Inter-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "AMS Display"; src: url("assets/fonts/InterDisplay-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    /* the open, the Outbreak way: the copy at the left, a dot story at the right; on the bare ground */
    #s1-field { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
    #s1-kick { left: 150px; top: 330px; }
    .s1-h { left: 150px; top: 378px; font-size: 88px; line-height: 96px; }
    .s1-sub { left: 152px; top: 490px; font-size: 36px; line-height: 46px; }
    .s1-row { position: absolute; left: 152px; display: flex; align-items: center; gap: 16px; white-space: nowrap;
      font-family: "AMS Text", sans-serif; font-weight: 500; font-size: 32px; line-height: 42px; letter-spacing: -0.01em; color: var(--label-2); }
    .s1-row i { display: block; flex: none; width: 14px; height: 14px; border-radius: 50%; background: var(--blue); }
    .s1-row b { font-weight: 600; color: var(--ink); }
    #s1-legend { top: 590px; }
    #s1-l1 { top: 590px; }
    #s1-l2 { top: 646px; }
    #s1-l3 { top: 702px; }
  </style>
  <div id="root" data-composition-id="s1-open" data-width="1920" data-height="1080">
    <svg id="s1-field" viewBox="0 0 1920 1080" aria-hidden="true"><g id="s1-g"></g></svg>
    <div id="s1-kick" class="kick">Federal assistance <span>· fiscal years 2019 to 2024</span></div>
    <div id="s1-h1" class="head s1-h">$8.58 trillion.</div>
    <div id="s1-h2" class="head s1-h">Where did it go?</div>
    <div id="s1-h3" class="head s1-h">It’s all public.</div>
    <div id="s1-sub2" class="sub s1-sub">And what did the audits find?</div>
    <div id="s1-sub3" class="sub s1-sub">But split across three federal databases:</div>
    <div id="s1-legend" class="s1-row"><i></i><span>$10 billion each</span></div>
    <div id="s1-l1" class="s1-row"><i></i><span><b>USAspending.gov</b> · who got the money</span></div>
    <div id="s1-l2" class="s1-row"><i></i><span><b>FAC.gov</b> · what audits found</span></div>
    <div id="s1-l3" class="s1-row"><i></i><span><b>SAM.gov</b> · who is excluded</span></div>
  </div>
  <script>
    (function () {
      const TM = window.TM, VO = window.VO, FM = window.FILM;
      const S0 = TM.s1[0], S1 = TM.s1[1];
      const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, "");
      const W = (k, w, nth = 0) => {
        const alts = w.split("|");
        for (const exact of [true, false]) {
          let c = 0;
          for (const x of VO[k].words) {
            const t = norm(x.w);
            if (alts.some((a) => (exact ? t === a : t.startsWith(a)))) { if (c === nth) return x.t0 - S0; c++; }
          }
        }
        return VO[k].start - S0;
      };
      const tl = gsap.timeline({ paused: true });
      const rise = (el, t, d = 0.55, dy = 22) =>
        tl.fromTo(el, { opacity: 0, y: dy, filter: "blur(5px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: d, ease: "power3.out", immediateRender: false }, t - 0.04);
      const out = (els, t, d = 0.28) => tl.to(els, { opacity: 0, y: -14, filter: "blur(5px)", duration: d, ease: "power3.in" }, t - d);

      // 858 dots, one per $10 billion
      const NS = "http://www.w3.org/2000/svg", g = document.querySelector("#s1-g");
      const C = FM.dots.map((d) => {
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("cx", d.fx.toFixed(1)); c.setAttribute("cy", d.fy.toFixed(1)); c.setAttribute("r", "0"); c.setAttribute("fill", FM.blue);
        g.appendChild(c); return c;
      });
      const copy = ["#s1-kick", "#s1-h1", "#s1-h2", "#s1-h3", "#s1-sub2", "#s1-sub3", "#s1-legend", "#s1-l1", "#s1-l2", "#s1-l3"];
      gsap.set(copy, { opacity: 0 });

      // v01: the figure, and the field blooms from the centre out on it
      rise("#s1-kick", 0.35);
      const T1 = W("v01", "8");
      rise("#s1-h1", T1);
      FM.dots.forEach((d, i) => tl.fromTo(C[i], { attr: { r: 0 } }, { attr: { r: FM.R }, duration: 0.4, ease: "back.out(1.6)", immediateRender: false }, T1 + 0.05 + d.bloom * 2.3));
      tl.fromTo("#s1-g", { scale: 0.965, svgOrigin: FM.field.x + " " + FM.field.y }, { scale: 1, duration: 6.5, ease: "power2.out", immediateRender: false }, T1);
      rise("#s1-legend", W("v01", "trillion") + 0.6);

      // v02: two questions
      const T2 = W("v02", "where");
      out("#s1-h1", T2);
      rise("#s1-h2", T2);
      rise("#s1-sub2", W("v02", "and"));

      // v03: it is all public, but in three places
      const T3 = W("v03", "it");
      out(["#s1-h2", "#s1-sub2", "#s1-legend"], T3);
      rise("#s1-h3", T3);
      rise("#s1-sub3", W("v03", "but"));
      tl.to("#s1-g", { opacity: 0.45, duration: 0.8, ease: "power2.inOut" }, W("v03", "but"));
      const T3b = W("v03", "three");
      ["#s1-l1", "#s1-l2", "#s1-l3"].forEach((el, i) => rise(el, T3b + i * 0.3, 0.55, 18));

      // the last bar before the drop (film bar 5): the copy clears and the dots stream onto the mark, over the riser.
      // The stream flows one way (each dot paired with a target in its own band), nearest dots first.
      const B5 = 12.371 - S0;
      out(["#s1-kick", "#s1-h3", "#s1-sub3", "#s1-l1", "#s1-l2", "#s1-l3"], B5 + 0.32, 0.36);
      tl.to("#s1-g", { opacity: 1, duration: 0.5, ease: "power2.out" }, B5);
      const D0 = B5 + 0.26, SPREAD = 0.85, FLY = 1.3;          // the last dot lands just before the downbeat
      FM.dots.forEach((d, i) => {
        const t = D0 + d.dep * SPREAD;
        tl.to(C[i], { attr: { cx: d.tx, cy: d.ty }, duration: FLY, ease: "power2.inOut" }, t);
        if (d.c) tl.to(C[i], { fill: FM.coral, duration: 0.35, ease: "power1.in" }, t + FLY * 0.62);
      });

      tl.set({}, {}, S1 - S0);
      window.__timelines["s1-open"] = tl;
    })();
  </script>
</template>
