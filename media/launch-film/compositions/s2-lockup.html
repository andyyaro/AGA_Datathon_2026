<template>
  <style>
    @font-face { font-family: "AMS Text"; src: url("assets/fonts/Inter-Medium.woff2") format("woff2"); font-weight: 500; font-display: block; }
    /* the lockup on the drop: the streamed dots resolve into the mark, the wordmark wipes in beside it, centred */
    #s2-all { position: absolute; inset: 0; }
    #s2-dots { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
    #s2-mark { position: absolute; overflow: visible; }
    #s2-word { position: absolute; display: block; }
    #s2-tag { position: absolute; left: 0; width: 1920px; text-align: center; font-family: "AMS Text", sans-serif; font-weight: 500;
      font-size: 42px; line-height: 54px; letter-spacing: -0.012em; color: var(--label-2); white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="s2-lockup" data-width="1920" data-height="1080">
    <div id="s2-all">
      <svg id="s2-dots" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
      <svg id="s2-mark" viewBox="0 0 120 120" aria-label="AuditsMadeSimple mark">
        <defs>
          <mask id="s2-ko" maskUnits="userSpaceOnUse" x="-20" y="-20" width="160" height="160">
            <rect x="-20" y="-20" width="160" height="160" fill="#fff" />
            <path id="s2-kop" d="M34 70 L51 86 L94 44" fill="none" stroke="#000" stroke-width="25" stroke-linecap="round" stroke-linejoin="round" />
          </mask>
        </defs>
        <g mask="url(#s2-ko)"><path id="s2-a" d="M20 104 L60 16 L100 104" fill="none" stroke="#1F3FE0" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" /></g>
        <path id="s2-c" d="M34 70 L51 86 L94 44" fill="none" stroke="#FF5A3C" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <img id="s2-word" src="assets/brand/film/wordmark.svg" alt="AuditsMadeSimple" />
      <div id="s2-tag">Federal spending and audit data, made understandable.</div>
    </div>
  </div>
  <script>
    (function () {
      const TM = window.TM, VO = window.VO, FM = window.FILM;
      const S0 = TM.s2[0], S1 = TM.s2[1];
      const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, "");
      const W = (k, w, nth = 0) => {
        const alts = w.split("|");
        for (const exact of [true, false]) {
          let c = 0;
          for (const x of VO[k].words) {
            const t = norm(x.w);
            if (alts.some((a) => (exact ? t === a : t.startsWith(a)))) { if (c === nth) return x.t0 - S0; c++; }
          }
        }
        return VO[k].start - S0;
      };
      const tl = gsap.timeline({ paused: true });
      const rise = (el, t, d = 0.6, dy = 22) =>
        tl.fromTo(el, { opacity: 0, y: dy, filter: "blur(5px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: d, ease: "power3.out", immediateRender: false }, t - 0.04);

      // place the lockup (window.FILM.lockup: the same boxes the dots streamed onto in s1)
      const [mx, my, ms] = FM.lockup.mark, [wx, wy, ww, wh] = FM.lockup.word;
      Object.assign(document.querySelector("#s2-mark").style, { left: mx + "px", top: my + "px", width: ms + "px", height: ms + "px" });
      Object.assign(document.querySelector("#s2-word").style, { left: wx.toFixed(1) + "px", top: wy.toFixed(1) + "px", width: ww.toFixed(1) + "px", height: wh.toFixed(1) + "px" });
      document.querySelector("#s2-tag").style.top = Math.round(my + ms + 62) + "px";

      // the dots, where s1 left them
      const NS = "http://www.w3.org/2000/svg", svg = document.querySelector("#s2-dots");
      const C = FM.dots.map((d) => {
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("cx", d.tx.toFixed(2)); c.setAttribute("cy", d.ty.toFixed(2)); c.setAttribute("r", FM.R);
        c.setAttribute("fill", d.c ? FM.coral : FM.blue);
        svg.appendChild(c); return c;
      });

      // on the downbeat the strokes draw along the dots, and each dot goes as the stroke reaches it
      const LA = 193.33, LC = 83.46, DA = 0.5, DC = 0.36, C0 = 0.12;
      gsap.set("#s2-a", { strokeDasharray: LA + 1, strokeDashoffset: LA + 1, opacity: 0 });
      gsap.set(["#s2-c", "#s2-kop"], { strokeDasharray: LC + 1, strokeDashoffset: LC + 1, opacity: 0 });
      tl.set("#s2-a", { opacity: 1 }, 0.01);
      tl.to("#s2-a", { strokeDashoffset: 0, duration: DA, ease: "power2.out" }, 0);
      tl.set(["#s2-c", "#s2-kop"], { opacity: 1 }, C0 + 0.01);
      tl.to(["#s2-c", "#s2-kop"], { strokeDashoffset: 0, duration: DC, ease: "power2.out" }, C0);
      // power2.out reaches fraction p at time d * (1 - sqrt(1 - p))
      FM.dots.forEach((d, i) => {
        const t = d.c ? C0 + DC * (1 - Math.sqrt(1 - d.p)) : DA * (1 - Math.sqrt(1 - d.p));
        tl.to(C[i], { opacity: 0, attr: { r: FM.R * 0.6 }, duration: 0.18, ease: "power1.in" }, t + 0.02);
      });

      // the wordmark wipes in beside the mark, on "Audits"
      gsap.set("#s2-word", { clipPath: "inset(0% 100% 0% 0%)", opacity: 0 });
      tl.fromTo("#s2-word", { clipPath: "inset(0% 100% 0% 0%)", opacity: 0, x: -16 },
        { clipPath: "inset(0% 0% 0% 0%)", opacity: 1, x: 0, duration: 0.85, ease: "power3.out", immediateRender: false }, 0.06);

      // v05: the line
      gsap.set("#s2-tag", { opacity: 0 });
      rise("#s2-tag", W("v05", "federal"), 0.7, 20);

      // a slow push on the held lockup, so the frame never sits dead (centred on the lockup)
      const [lx0, ly0] = [mx, my], lcx = (mx + wx + ww) / 2, lcy = my + ms / 2 + 40;
      gsap.set("#s2-all", { transformOrigin: lcx.toFixed(1) + "px " + lcy.toFixed(1) + "px" });
      tl.fromTo("#s2-all", { scale: 1 }, { scale: 1.018, duration: S1 - S0 - 0.9, ease: "sine.inOut", immediateRender: false }, 0.45);

      // out: the lockup lifts and blurs, and the window settles in its place (index.html, on s3's first frame)
      tl.to("#s2-all", { opacity: 0, y: -34, filter: "blur(6px)", duration: 0.42, ease: "power2.in" }, S1 - S0 - 0.46);

      tl.set({}, {}, S1 - S0);
      window.__timelines["s2-lockup"] = tl;
    })();
  </script>
</template>
