<template>
  <style>
    @font-face { font-family: "AMS Text"; src: url("assets/fonts/Inter-Medium.woff2") format("woff2"); font-weight: 500; font-display: block; }
    @font-face { font-family: "AMS Text"; src: url("assets/fonts/Inter-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "AMS Display"; src: url("assets/fonts/InterDisplay-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    /* the copy over the window for the Tableau dashboards (the window itself is in index.html) */
  </style>
  <div id="root" data-composition-id="s3-explore" data-width="1920" data-height="1080">
    <div id="s3-kick" class="kick wk">Explore</div>
    <div id="s3-head" class="head wh">See where the money goes.</div>
    <div id="s3-sub" class="sub wsub">Interactive Tableau dashboards, built by the team.</div>
  </div>
  <script>
    (function () {
      const TM = window.TM, VO = window.VO;
      const S0 = TM.s3[0], S1 = TM.s3[1];
      const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, "");
      const W = (k, w, nth = 0) => {
        const alts = w.split("|");
        for (const exact of [true, false]) {
          let c = 0;
          for (const x of VO[k].words) {
            const t = norm(x.w);
            if (alts.some((a) => (exact ? t === a : t.startsWith(a)))) { if (c === nth) return x.t0 - S0; c++; }
          }
        }
        return VO[k].start - S0;
      };
      const tl = gsap.timeline({ paused: true });
      const rise = (el, t, d = 0.55, dy = 22) =>
        tl.fromTo(el, { opacity: 0, y: dy, filter: "blur(5px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: d, ease: "power3.out", immediateRender: false }, t - 0.04);
      const els = ["#s3-kick", "#s3-head", "#s3-sub"];
      gsap.set(els, { opacity: 0 });
      rise("#s3-kick", 0.15, 0.5, 16);
      rise("#s3-head", W("v06", "start"));
      rise("#s3-sub", W("v06", "interactive"), 0.55, 16);
      // out with the screen swap (the window's screen empties over the same 0.275 s)
      tl.to(els, { opacity: 0, y: -14, filter: "blur(4px)", duration: 0.24, ease: "power2.in" }, S1 - S0 - 0.27);
      tl.set({}, {}, S1 - S0);
      window.__timelines["s3-explore"] = tl;
    })();
  </script>
</template>
