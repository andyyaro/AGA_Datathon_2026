<!doctype html>
<html
  lang="en"
  data-resolution="landscape"
  data-composition-variables='[
  {"id":"color-ground","type":"color","label":"Ground","default":"#F2F2F7"},
  {"id":"color-ink","type":"color","label":"Ink","default":"#10183A"},
  {"id":"color-accent","type":"color","label":"Accent","default":"#1F3FE0"}
]'
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>AuditsMadeSimple: launch film</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/vo.js"></script>
    <script src="assets/timing.js"></script>
    <script src="assets/edit.js"></script>
    <script src="assets/film.js"></script>
    <style>
      /* Inter and Inter Display (SIL OFL, assets/fonts/OFL-Inter.txt) stand in for SF Pro, the face HIG Native names
         and the live site renders in; the Outbreak films use them too. No fixed-width face anywhere (Andy's rule): the
         address pill, numbers and code words are all Inter. */
      @font-face { font-family: "AMS Text"; src: url("assets/fonts/Inter-Regular.woff2") format("woff2"); font-weight: 400; font-display: block; }
      @font-face { font-family: "AMS Text"; src: url("assets/fonts/Inter-Medium.woff2") format("woff2"); font-weight: 500; font-display: block; }
      @font-face { font-family: "AMS Text"; src: url("assets/fonts/Inter-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
      @font-face { font-family: "AMS Display"; src: url("assets/fonts/InterDisplay-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }

      /* HIG Native light tokens (the design system the CERFODES architecture film used), with the AuditsMadeSimple
         brand on top: blue is the one accent, navy the headline ink, coral only the check in the mark. */
      :root {
        --ground: #f2f2f7;                 /* grouped-background-primary */
        --surface: #ffffff;                /* grouped-background-secondary */
        --label: #000000;                  /* label-primary */
        --label-2: #68686d;                /* label-secondary, solid for video legibility (as the CERFODES film) */
        --sep: rgba(0, 0, 0, 0.12);        /* separator */
        --fill-3: rgba(118, 118, 128, 0.12);
        --fill-4: rgba(116, 116, 128, 0.08);
        --ink: #10183a;                    /* brand navy */
        --blue: #1f3fe0;                   /* brand blue: the accent */
        --coral: #ff5a3c;                  /* brand coral: the check in the mark, nothing else */
        --green: #34c759;                  /* system green */
        --yellow: #ffcc00;                 /* system yellow: dots only, never text */
        --red: #ff383c;                    /* system red */
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #main {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        color: var(--ink); font-family: "AMS Text", sans-serif; -webkit-font-smoothing: antialiased;
      }
      #bg { position: absolute; inset: 0; background: var(--ground); }
      .num { font-variant-numeric: tabular-nums; }

      /* shared copy, used by every scene: a small coloured kicker, a bold sentence-case headline, one grey sub-line */
      .kick { position: absolute; font-family: "AMS Text", sans-serif; font-weight: 600; font-size: 28px; line-height: 36px; letter-spacing: -0.003em; color: var(--blue); white-space: nowrap; }
      .kick span { color: var(--label-2); font-weight: 500; }
      .head { position: absolute; font-family: "AMS Display", sans-serif; font-weight: 600; font-size: 76px; line-height: 86px; letter-spacing: -0.025em; color: var(--ink); white-space: nowrap; }
      .sub { position: absolute; font-family: "AMS Text", sans-serif; font-weight: 500; font-size: 33px; line-height: 44px; letter-spacing: -0.01em; color: var(--label-2); white-space: nowrap; }
      /* the copy over the window: aligned to the window's left edge */
      .wk { left: 360px; top: 58px; }
      .wh { left: 360px; top: 98px; }
      .wsub { left: 360px; top: 192px; }

      /* the window: HyperFrames' browser-device-stage chrome (muted dots, an address pill, hairlines), rebuilt around
         media clips so every take lands on its recorded frame. HIG mac window radius 16; a hairline, no shadow. */
      #stage { position: absolute; left: 359px; top: 289px; width: 1202px; height: 727px; transform-origin: 50% 60%; }
      #device { width: 1202px; height: 727px; overflow: hidden; border-radius: 16px; background: var(--surface); border: 1px solid var(--sep); }
      #bar {
        height: 50px; display: flex; align-items: center; padding: 0 22px; gap: 20px;
        border-bottom: 1px solid var(--sep); background: #fbfbfd;
      }
      #bar .dots, #bar .end { display: flex; flex: 0 0 64px; gap: 10px; }
      #bar .dots i { display: block; width: 12px; height: 12px; border-radius: 50%; background: rgba(60, 60, 67, 0.22); }
      #pill {
        min-width: 36%; margin: 0 auto; padding: 4px 28px; border-radius: 9999px; text-align: center; white-space: nowrap;
        background: var(--fill-4); color: var(--label-2);
        font-family: "AMS Text", sans-serif; font-weight: 500; font-size: 22px; line-height: 30px; letter-spacing: -0.005em;
      }
      #screen { position: relative; width: 1200px; height: 675px; overflow: hidden; background: #fbfdfd; }
      .scr { position: absolute; left: 0; top: 0; width: 1200px; height: 675px; visibility: hidden; }
      .cam { position: absolute; left: 0; top: 0; width: 1200px; height: 675px; transform-origin: 0 0; }
      .cam video { position: absolute; left: 0; top: 0; width: 1200px; height: 675px; display: block; }
      /* the cursor, drawn by the composition on the recorded mouse path (tip at 4.4, 3) */
      .cur { position: absolute; left: 0; top: 0; width: 34px; height: 43px; transform-origin: 4.4px 3px; }
      .cur svg { display: block; width: 34px; height: 43px; }
      .ring { position: absolute; left: 0; top: 0; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
        border: 3px solid var(--blue); background: rgba(31, 63, 224, 0.12); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="67.4" data-width="1920" data-height="1080">
      <div id="bg"></div>

      <audio id="soundtrack" class="clip" src="assets/audio/mix.wav" data-start="0" data-duration="67.4" data-track-index="0" data-volume="1"></audio>

      <!-- the window (s3 to s5): one stage, its screen swapping take to take; the takes are the live site, recorded -->
      <div id="stage">
        <div id="device">
          <div id="bar"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span id="pill">gmufiscalpatriots.bytechisel.com</span><span class="end"></span></div>
          <div id="screen">
            <div class="scr" id="scr-explore"><div class="cam" id="cam-explore"><video id="v-explore" class="clip" src="assets/shots/explore.mp4" muted playsinline data-start="20.9333" data-duration="9.4000" data-media-start="0" data-track-index="10"></video><div class="ring" id="ring-explore"></div><div class="cur" id="cur-explore"><svg viewBox="0 0 46 58" aria-hidden="true"><path d="M6 4 L6 46 L16.5 36.2 L23.4 52.4 L30.6 49.3 L23.8 33.4 L38.2 33.4 Z" fill="#000" stroke="#fff" stroke-width="3.2" stroke-linejoin="round" /></svg></div></div></div>
            <div class="scr" id="scr-glossary"><div class="cam" id="cam-glossary"><video id="v-glossary" class="clip" src="assets/shots/glossary.mp4" muted playsinline data-start="29.6000" data-duration="8.1667" data-media-start="0" data-track-index="11"></video><div class="ring" id="ring-glossary"></div><div class="cur" id="cur-glossary"><svg viewBox="0 0 46 58" aria-hidden="true"><path d="M6 4 L6 46 L16.5 36.2 L23.4 52.4 L30.6 49.3 L23.8 33.4 L38.2 33.4 Z" fill="#000" stroke="#fff" stroke-width="3.2" stroke-linejoin="round" /></svg></div></div></div>
            <div class="scr" id="scr-score"><div class="cam" id="cam-score"><video id="v-score" class="clip" src="assets/shots/score.mp4" muted playsinline data-start="37.0000" data-duration="10.6667" data-media-start="0" data-track-index="12"></video><div class="ring" id="ring-score"></div><div class="cur" id="cur-score"><svg viewBox="0 0 46 58" aria-hidden="true"><path d="M6 4 L6 46 L16.5 36.2 L23.4 52.4 L30.6 49.3 L23.8 33.4 L38.2 33.4 Z" fill="#000" stroke="#fff" stroke-width="3.2" stroke-linejoin="round" /></svg></div></div></div>
          </div>
        </div>
      </div>

      <div id="s1-open" data-composition-id="s1-open" data-composition-src="compositions/s1-open.html" data-start="0" data-duration="14.845" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s2-lockup" data-composition-id="s2-lockup" data-composition-src="compositions/s2-lockup.html" data-start="14.845" data-duration="6.186" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="s3-explore" data-composition-id="s3-explore" data-composition-src="compositions/s3-explore.html" data-start="21.031" data-duration="8.66" data-track-index="3" data-width="1920" data-height="1080"></div>
      <div id="s4-glossary" data-composition-id="s4-glossary" data-composition-src="compositions/s4-glossary.html" data-start="29.691" data-duration="7.422" data-track-index="4" data-width="1920" data-height="1080"></div>
      <div id="s5-score" data-composition-id="s5-score" data-composition-src="compositions/s5-score.html" data-start="37.113" data-duration="9.897" data-track-index="5" data-width="1920" data-height="1080"></div>
      <div id="s6-proof" data-composition-id="s6-proof" data-composition-src="compositions/s6-proof.html" data-start="47.01" data-duration="7.423" data-track-index="6" data-width="1920" data-height="1080"></div>
      <div id="s7-team" data-composition-id="s7-team" data-composition-src="compositions/s7-team.html" data-start="54.433" data-duration="7.423" data-track-index="7" data-width="1920" data-height="1080"></div>
      <div id="s8-end" data-composition-id="s8-end" data-composition-src="compositions/s8-end.html" data-start="61.856" data-duration="5.544" data-track-index="8" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      (function () {
        /* The window, s3 to s5 (then it steps aside for the proof). Its moves are browser-device-stage's: the settle
           (0.9 s: opacity over the first 66%, rise 4.5% of the frame, scale 0.965 -> 1), the screen swap (0.55 s through
           the bare stage: A empties in 0.275 s, then B rises 1.6% of the frame), plus EV-SIENT's push-ins on the thing
           the voice names (scale <= 1.35, 1.1 s power2.inOut). Times come from window.TM (the scene windows),
           window.VO (word times) and window.EDIT (the takes: clip starts, cursor per film frame, marks, element boxes). */
        const TM = window.TM, VO = window.VO, ED = window.EDIT, SH = ED.shots;
        const FPS = 30, K = 1200 / ED.viewport[0], SWAP = 0.275;
        const tl = gsap.timeline({ paused: true });
        const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, "");
        const W = (k, w, nth = 0) => {                    // a word's start in film seconds
          const alts = w.split("|");
          for (const exact of [true, false]) {
            let c = 0;
            for (const x of VO[k].words) {
              const t = norm(x.w);
              if (alts.some((a) => (exact ? t === a : t.startsWith(a)))) { if (c === nth) return x.t0; c++; }
            }
          }
          return VO[k].start;
        };
        const show = (sel, t0, t1) => {
          gsap.set(sel, { visibility: "hidden" });
          tl.set(sel, { visibility: "visible" }, t0);
          tl.set(sel, { visibility: "hidden" }, t1);
        };

        // the settle, on the first frame of s3 (the lockup has lifted away by then)
        const S3 = TM.s3[0], S4 = TM.s4[0], S5 = TM.s5[0], S6 = TM.s6[0];
        gsap.set("#stage", { opacity: 0 });
        tl.fromTo("#stage", { opacity: 0 }, { opacity: 1, duration: 0.594, ease: "power2.out", immediateRender: false }, S3);
        tl.fromTo("#stage", { y: 48.6 }, { y: 0, duration: 0.9, ease: "power3.out", immediateRender: false }, S3);
        tl.fromTo("#stage", { scale: 0.965 }, { scale: 1, duration: 0.9, ease: "power2.out", immediateRender: false }, S3);

        // each take shows for its clip's time; the swap's halves fall at the scene line
        const take = (name, tin, tout) => {
          const m = SH[name], t0 = m.start, t1 = m.start + m.dur;
          const scr = "#scr-" + name, cur = "#cur-" + name, ring = "#ring-" + name;
          show(scr, t0, t1);
          if (tin == null) gsap.set(scr, { opacity: 1, y: 0 });
          else {
            gsap.set(scr, { opacity: 0 });
            tl.fromTo(scr, { opacity: 0, y: 17.3 }, { opacity: 1, y: 0, duration: SWAP, ease: "power2.out", immediateRender: false }, tin);
          }
          if (tout != null) tl.to(scr, { opacity: 0, duration: SWAP, ease: "power1.in" }, tout - SWAP);
          // the cursor: one recorded position per film frame, scaled into the window; a press shrinks it and rings
          let last = "", vis = 0, down = 0;
          gsap.set(cur, { opacity: 0 });
          m.cursor.forEach(([x, y, d, v], i) => {
            const t = t0 + i / FPS - 0.004;
            const s = { x: +(x * K - 4.4).toFixed(2), y: +(y * K - 3).toFixed(2), scale: d ? 0.86 : 1 };
            const key = s.x + "," + s.y + "," + s.scale;
            if (key !== last) { tl.set(cur, s, Math.max(0, t)); last = key; }
            if (v && !vis) tl.to(cur, { opacity: 1, duration: 0.2, ease: "power2.out" }, t);
            if (!v && vis) tl.to(cur, { opacity: 0, duration: 0.2, ease: "power2.in" }, t);
            if (d && !down) {
              tl.set(ring, { x: +(x * K).toFixed(2), y: +(y * K).toFixed(2) }, t);
              tl.fromTo(ring, { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.3, duration: 0.5, ease: "power2.out", immediateRender: false }, t);
            }
            vis = v; down = d;
          });
          gsap.set(ring, { opacity: 0 });
          return m;
        };
        take("explore", null, S4);
        take("glossary", S4, S5);
        take("score", S5, null);

        // a push-in: scale s about an element box (CSS px of the 1600 x 900 viewport), clamped so the page fills the
        // screen; and back
        const camTo = (name, rect, s, t, d = 1.1) => {
          let x = 0, y = 0;
          if (rect) {
            const cx = (rect[0] + rect[2] / 2) * K, cy = (rect[1] + rect[3] / 2) * K;
            x = Math.min(0, Math.max(1200 - 1200 * s, 600 - s * cx));
            y = Math.min(0, Math.max(675 - 675 * s, 337.5 - s * cy));
          }
          tl.to("#cam-" + name, { scale: s, x, y, duration: d, ease: "power2.inOut" }, t);
        };
        // a push-in framed by hand: scale s with the view's top-left corner at (left, top) in CSS px of the viewport
        // (review 2026-11-01: used where a box-centred push cut a page element in half at the window's edge)
        const camView = (name, s, left, top, t, d = 1.1) => {
          const x = Math.min(0, Math.max(1200 - 1200 * s, -left * K * s)), y = Math.min(0, Math.max(675 - 675 * s, -top * K * s));
          tl.to("#cam-" + name, { scale: s, x, y, duration: d, ease: "power2.inOut" }, t);
        };
        gsap.set(".cam", { scale: 1, x: 0, y: 0 });
        // s3, "Ten states": the dashboard's ten gold bars
        camTo("explore", SH.explore.rects.bars, 1.35, W("v07", "ten") - 0.12);
        // s4, "plain words": the Material Weakness card as it flips, framed with the search field that found it: the view
        // spans the search box (CSS x 400 to 1200, y from 234.8) and the two cards (x from 136, y to 776.2) with even
        // margins, its top just under the page's intro line (ends at CSS y 173), so nothing is cut at an edge
        camView("glossary", 1.35, 75.5, 185, SH.glossary.marks.flip - 0.2);
        // s5, "one number": the whole simulator card (CSS y 184.7 to 651.6) with the site's "try the simulator!" scribble
        // above it (from y 163) and the site's own "screening signal, not proof of wrongdoing" note below (to y 803);
        // the next heading ("What it is used for", y 862) stays out of frame, as does the sticky top bar
        camView("score", 1.32, 193.9, 142, W("v09", "one") - 0.25);

        // s6: the window steps aside to the left and leaves
        tl.to("#stage", { x: -260, scale: 0.94, opacity: 0, duration: 0.6, ease: "power2.in" }, S6);

        tl.set({}, {}, TM.duration);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
